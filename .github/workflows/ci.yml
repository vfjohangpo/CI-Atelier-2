name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=xml
      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Exemple d'utilisation d'un secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: echo "La clé est bien utilisée mais jamais affichée en clair"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que l'app démarre
        run: |
          pip install -r requirements.txt
          python -c "from app.main import app; print('Import OK')"
