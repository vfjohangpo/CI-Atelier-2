name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier le code avec Ruff
        run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: |
          pytest \
            --junitxml=report.xml \
            --cov=app \
            --cov-report=term \
            --cov-report=xml

      - name: Publier le résumé des tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Résultats des tests - Python ${{ matrix.python-version }}
          path: report.xml
          reporter: java-junit

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml

      - name: Exemple d'utilisation d'un secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: echo "La clé est bien utilisée mais jamais affichée en clair"

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pipeline-craft:${{ github.sha }}