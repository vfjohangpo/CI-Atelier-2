[project]
name = "pipeline-craft"
version = "0.1.0"
description = "API FastAPI fil rouge pour les labs GitLab CI/CD"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
